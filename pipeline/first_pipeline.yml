# Run the pipeline whenever main is updated
trigger:
  branches:
    include:
      - main

# Continuous integration stage
stages:
  - stage: Test
    displayName: Test application

    jobs:
      - job: RunTests
        displayName: Run Python tests

        pool:
          vmImage: ubuntu-latest

        steps:
          - task: UsePythonVersion@0
            displayName: Use Python 3.14
            inputs:
              versionSpec: '3.14'

          - script: |
              python -m pip install --upgrade pip
              pip install -r pipeline/requirements.txt
            displayName: Install requirements

          - script: |
              python -m pytest testing/testing_module.py -v --junitxml=test-results.xml
            displayName: Run pytest tests

          - script: |
              python -m testing.unittest_module -v
            displayName: Run unittest tests

          - task: PublishTestResults@2
            displayName: Publish pytest results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/test-results.xml'
              testRunTitle: Library data cleaning tests

  # Continuous delivery stage
  - stage: Deploy
    displayName: Create and publish database
    dependsOn: Test
    condition: succeeded()

    jobs:
      - job: CreateDatabase
        displayName: Create SQLite database

        pool:
          vmImage: ubuntu-latest

        steps:
          - task: UsePythonVersion@0
            displayName: Use Python 3.14
            inputs:
              versionSpec: '3.14'

          - script: |
              python -m pip install --upgrade pip
              pip install -r pipeline/requirements.txt
            displayName: Install requirements

          - script: |
              python -m testing.cleaning_module
            displayName: Clean library data

          - script: |
              python pipeline/create_database.py
            displayName: Create library database

          - task: PublishPipelineArtifact@1
            displayName: Publish library database
            inputs:
              targetPath: output
              artifact: library-database