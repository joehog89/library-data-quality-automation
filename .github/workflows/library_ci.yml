# GitHub Actions workflow for the library project

name: Joes Library Tests

# Controls when the workflow runs
on:
  # Runs when code is pushed to main
  push:
    branches: ["main"]

  # Runs when a pull request targets main
  pull_request:
    branches: ["main"]

  # Allows the workflow to be run manually
  workflow_dispatch:

# Cancels an older run when a newer run starts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Use a GitHub-hosted Linux machine
    runs-on: ubuntu-24.04

    steps:
      # Download the repository onto the runner
      - name: Checkout repository
        uses: actions/checkout@v7

      # Print my name
      - name: Print my name
        run: echo "Hello, Joe!"

            # Checks that the GitHub secret is available
      - name: Check GitHub secret
        env:
          LIBRARY_SECRET: ${{ secrets.LIBRARY_SECRET }}
        run: |
          if [ -n "$LIBRARY_SECRET" ]; then
            echo "GitHub secret loaded successfully"
          else
            echo "GitHub secret was not found"
            exit 1
          fi

      # Install Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Display the installed Python version
      - name: Check Python version
        run: python --version

      # Install the required Python modules
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      # Run the pytest tests
      - name: Run pytest tests
        run: python -m pytest testing/testing_module.py -v

      # Run the unittest tests
      - name: Run unittest tests
        run: python -m testing.unittest_module -v